name: Bootstrap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bootstrap:
    if: github.repository != 'jonp200/go-sdk-template' && github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[bootstrap]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Update go.mod Go directive
        shell: bash
        run: |
          GO_VERSION=$(go env GOVERSION | sed 's/^go//')
          go mod edit -go "$GO_VERSION"

      - name: Fetch canonical Go .gitignore
        shell: bash
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/github/gitignore/main/Go.gitignore \
            -o .gitignore

      - name: Remove placeholder files
        shell: bash
        run: |
          rm -f doc.go
          rm -f .github/workflows/bootstrap.yml

      - name: Commit changes if needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add go.mod .gitignore
          git add -u doc.go
          git add -u .github/workflows/bootstrap.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync template defaults [bootstrap]"
            git push
          fi
